# API Gateway: единая входная точка системы (порт 8080 на хосте).
# Маршрутизация по первой части пути:
#   /books/...    -> catalog-service
#   /readers/...  -> reader-service
#   /loans/...    -> loan-service

# Встроенный DNS Docker. Имена сервисов разрешаются при каждом запросе,
# поэтому gateway стартует, даже если сервис за ним ещё не поднялся.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location = /health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location ~ ^/books(/|$) {
        set $upstream http://catalog-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/readers(/|$) {
        set $upstream http://reader-service:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/loans(/|$) {
        set $upstream http://loan-service:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Use /books, /readers or /loans"}\n';
    }
}
